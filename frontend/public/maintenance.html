<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="robots" content="noindex" />

    <title>Splitzy · Down for maintenance</title>
    <meta
      name="description"
      content="Splitzy is temporarily down for maintenance. We'll be back shortly."
    />

    <script>
      // Mirrors next-themes (attribute="class", defaultTheme="system", key "theme")
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          /* no-op: fall back to the prefers-color-scheme media query below */
        }
      })();
    </script>

    <style>
      /* ── Fonts (self-hosted latin subsets, copied from @fontsource-variable) ── */
      @font-face {
        font-family: 'Fraunces Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url(/fonts/fraunces-latin-wght-normal.woff2)
          format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Fraunces Variable';
        font-style: italic;
        font-display: swap;
        font-weight: 100 900;
        src: url(/fonts/fraunces-latin-wght-italic.woff2)
          format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url(/fonts/plus-jakarta-sans-latin-wght-normal.woff2)
          format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* ── Theme tokens (mirrors src/index.css) ── */
      :root {
        --background: 36 30% 97%;
        --foreground: 24 20% 12%;
        --card: 0 0% 100%;
        --card-foreground: 24 20% 12%;
        --primary: 220 40% 16%;
        --primary-foreground: 36 30% 97%;
        --muted-foreground: 30 8% 50%;
        --accent: 18 55% 91%;
        --border: 32 18% 88%;
        --ring: 220 40% 16%;
        --radius: 0.75rem;
      }

      .dark {
        --background: 24 20% 8%;
        --foreground: 36 30% 95%;
        --card: 24 20% 8%;
        --card-foreground: 36 30% 95%;
        --primary: 36 30% 92%;
        --primary-foreground: 24 20% 10%;
        --muted-foreground: 30 10% 60%;
        --accent: 18 25% 20%;
        --border: 30 18% 20%;
        --ring: 30 25% 80%;
      }

      /* Fallback when the inline script cannot run (e.g. JS disabled). The
         script adds `.dark` explicitly, so the `:not(.dark)` guard keeps an
         explicit light choice from being overridden. */
      @media (prefers-color-scheme: dark) {
        html:not(.dark) {
          color-scheme: dark;
          --background: 24 20% 8%;
          --foreground: 36 30% 95%;
          --card: 24 20% 8%;
          --card-foreground: 36 30% 95%;
          --primary: 36 30% 92%;
          --primary-foreground: 24 20% 10%;
          --muted-foreground: 30 10% 60%;
          --accent: 18 25% 20%;
          --border: 30 18% 20%;
          --ring: 30 25% 80%;
        }
      }

      /* ── Reset ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      svg {
        display: block;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family:
          'Plus Jakarta Sans Variable',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ── Header ── */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
        width: 100%;
        border-bottom: 1px solid hsl(var(--border));
        background-color: hsl(var(--background) / 0.95);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }
      @supports (backdrop-filter: blur(8px)) {
        .site-header {
          backdrop-filter: blur(8px);
          background-color: hsl(var(--background) / 0.6);
        }
      }
      .site-header .bar {
        display: flex;
        align-items: center;
        height: 3.5rem;
        padding: 0 0.5rem;
        max-width: 1400px;
        margin: 0 auto;
      }
      @media (min-width: 640px) {
        .site-header .bar {
          padding: 0 1rem;
        }
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 700;
        color: inherit;
        text-decoration: none;
      }
      .brand:focus-visible {
        outline: 2px solid hsl(var(--ring));
        outline-offset: 2px;
        border-radius: 0.375rem;
      }

      /* ── Main ── */
      main {
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
        padding: 2rem 1rem 2.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .fade-up {
        opacity: 0;
        transform: translateY(16px);
        animation: fade-up 450ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes fade-up {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fade-up {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }

      .eyebrow {
        margin: 0 0 0.5rem;
        text-align: center;
        font-size: 10px;
        line-height: 1.4;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: hsl(var(--muted-foreground));
      }

      h1 {
        margin: 0;
        text-align: center;
        font-family: 'Fraunces Variable', Georgia, serif;
        font-size: 1.4rem;
        font-weight: 600;
        line-height: 1.375;
        letter-spacing: -0.01em;
        color: hsl(var(--foreground));
      }
      h1 .soft {
        font-weight: 300;
        font-style: italic;
      }

      /* ── Card ── */
      .card {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        border-radius: 1rem;
        background-color: hsl(var(--card));
        color: hsl(var(--card-foreground));
        padding: 1.25rem;
        box-shadow:
          0 1px 4px 0 rgb(0 0 0 / 0.06),
          0 0 0 1px hsl(var(--border) / 0.7);
      }
      .tile {
        margin-top: 0.25rem;
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.75rem;
        background-color: hsl(var(--accent));
        font-size: 1.25rem;
        line-height: 1.75rem;
      }
      .card h2 {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 600;
        color: hsl(var(--foreground));
      }
      .card p {
        margin: 0.125rem 0 0;
        font-size: 0.875rem;
        line-height: 1.625;
        color: hsl(var(--muted-foreground));
      }

      /* ── Status row ── */
      .status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        font-size: 0.75rem;
        line-height: 1rem;
        color: hsl(var(--muted-foreground));
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background-color: #eab308;
      }

      /* ── Button ── */
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        white-space: nowrap;
        align-self: center;
        height: 2.25rem;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        background-color: hsl(var(--primary));
        color: hsl(var(--primary-foreground));
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 500;
        text-decoration: none;
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        transition: opacity 150ms ease;
      }
      .button:hover {
        opacity: 0.9;
      }
      .button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 1px hsl(var(--ring));
      }

      /* ── Footer ── */
      .site-footer {
        margin-top: auto;
        border-top: 1px solid hsl(var(--border));
        background-color: hsl(var(--card) / 0.4);
        padding: 0.5rem 0;
      }
      .site-footer .bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        padding: 0 0.5rem;
        max-width: 1400px;
        margin: 0 auto;
      }
      .site-footer p {
        margin: 0;
        font-size: 0.75rem;
        line-height: 1rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="bar">
        <a class="brand" href="/">
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"
            />
            <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
            <path d="M12 17.5v-11" />
          </svg>
          Splitzy
        </a>
      </div>
    </header>

    <main class="fade-up">
      <div>
        <p class="eyebrow">Maintenance</p>
        <h1>
          We're fixing a few things,<br />
          <span class="soft">back shortly.</span>
        </h1>
      </div>

      <div class="card">
        <div class="tile" aria-hidden="true">🔧</div>
        <div>
          <h2>Splitzy is temporarily unavailable</h2>
          <p>
            We're working on fixes right now. Any receipts you've already split
            are safe and will be here when we're back. Thanks for your patience.
          </p>
        </div>
      </div>

      <div class="status" role="status">
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
          <rect width="20" height="8" x="2" y="14" rx="2" ry="2" />
          <line x1="6" x2="6.01" y1="6" y2="6" />
          <line x1="6" x2="6.01" y1="18" y2="18" />
        </svg>
        <span>Status</span>
        <span class="dot" aria-hidden="true"></span>
        <span>working on it</span>
      </div>

      <a class="button" href="/">Check again</a>
    </main>

    <footer class="site-footer">
      <div class="bar">
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"
          />
          <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
          <path d="M12 17.5v-11" />
        </svg>
        <p>© <span id="year">2026</span> Splitzy</p>
      </div>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
